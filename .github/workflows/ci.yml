name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (worker · client · node)
        run: npm run typecheck
      - name: Tests unitarios
        run: npm test

  migrations:
    name: Migraciones aplicables en limpio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Levanta el stack y aplica TODAS las migraciones desde cero.
      # Si una no es aplicable en limpio, el PR no pasa.
      - run: supabase start
      - run: supabase db reset --no-seed
      - name: Avisos de seguridad (RLS, funciones)
        run: supabase db lint --level warning
